name: Preparar e publicar apps nas lojas

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma a processar
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      google_publish:
        description: Enviar o AAB ao Google Play
        required: true
        default: false
        type: boolean
      google_track:
        description: Faixa do Google Play
        required: true
        default: internal
        type: string
      apple_testflight:
        description: Enviar o IPA ao TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    name: Android • AAB produção
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE_ID: com.douglassnake.radarguardamor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ruby
        if: ${{ inputs.google_publish }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          grep -q "targetSdkVersion = 36" android/variables.gradle
      - name: Gerar ícones do aplicativo
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          src=Image.open("site/icons/icon-512.png").convert("RGB")
          src.resize((1024,1024), Image.Resampling.LANCZOS).save("assets/icon.png")
          PY
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#06284b" --splashBackgroundColor "#06284b"
      - name: Validar segredos Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 não configurado"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD não configurado"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS não configurado"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD não configurado"; exit 1; }
      - name: Configurar assinatura e versão
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              defaultConfig {
                  versionCode System.getenv("ANDROID_VERSION_CODE").toInteger()
                  versionName System.getenv("ANDROID_VERSION_NAME")
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compilar AAB assinado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Publicar artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: radar-guarda-mor-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Validar credencial Google Play
        if: ${{ inputs.google_publish }}
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$GOOGLE_JSON" || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON não configurado"; exit 1; }
      - name: Enviar ao Google Play
        if: ${{ inputs.google_publish }}
        env:
          ANDROID_AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          GOOGLE_PLAY_TRACK: ${{ inputs.google_track }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android upload

  ios:
    name: iOS • IPA App Store
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.douglassnake.radarguardamor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar Xcode 26+
        run: |
          xcodebuild -version
          MAJOR="$(xcodebuild -version | head -1 | awk '{print int($2)}')"
          test "$MAJOR" -ge 26 || { echo "App Store exige Xcode 26 ou superior"; exit 1; }
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ruby
        if: ${{ inputs.apple_testflight }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar projeto iOS
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Gerar ícones do aplicativo
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          src=Image.open("site/icons/icon-512.png").convert("RGB")
          src.resize((1024,1024), Image.Resampling.LANCZOS).save("assets/icon.png")
          PY
          npx @capacitor/assets generate --ios --assetPath assets --iconBackgroundColor "#06284b" --splashBackgroundColor "#06284b"
      - name: Validar segredos Apple
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$TEAM_ID" || { echo "APPLE_TEAM_ID não configurado"; exit 1; }
          test -n "$CERT_B64" || { echo "APPLE_CERTIFICATE_P12_BASE64 não configurado"; exit 1; }
          test -n "$CERT_PASSWORD" || { echo "APPLE_CERTIFICATE_PASSWORD não configurado"; exit 1; }
          test -n "$PROFILE_B64" || { echo "APPLE_PROVISIONING_PROFILE_BASE64 não configurado"; exit 1; }
      - name: Instalar certificado e profile
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD="radar-${GITHUB_RUN_ID}"
          KEYCHAIN_PATH="$RUNNER_TEMP/radar-signing.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "APPLE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Criar archive assinado
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          mkdir -p build/ios
          COMMON=(
            -scheme App
            -configuration Release
            -sdk iphoneos
            -archivePath "$PWD/build/ios/RadarGuardaMor.xcarchive"
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
            DEVELOPMENT_TEAM="$TEAM_ID"
            CODE_SIGN_STYLE=Manual
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROFILE_NAME"
            MARKETING_VERSION="$VERSION_NAME"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          )
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace "${COMMON[@]}" archive
          else
            xcodebuild -project ios/App/App.xcodeproj "${COMMON[@]}" archive
          fi
      - name: Exportar IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APPLE_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$PWD/build/ios/RadarGuardaMor.xcarchive"             -exportPath "$PWD/build/ios/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$PWD/build/ios/export" -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "IOS_IPA_PATH=$IPA" >> "$GITHUB_ENV"
      - name: Publicar artifact IPA
        uses: actions/upload-artifact@v4
        with:
          name: radar-guarda-mor-ios-ipa
          path: build/ios/export/*.ipa
          if-no-files-found: error
      - name: Validar credencial App Store Connect
        if: ${{ inputs.apple_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$KEY_ID" || { echo "APP_STORE_CONNECT_KEY_ID não configurado"; exit 1; }
          test -n "$ISSUER_ID" || { echo "APP_STORE_CONNECT_ISSUER_ID não configurado"; exit 1; }
          test -n "$API_KEY" || { echo "APP_STORE_CONNECT_API_KEY_BASE64 não configurado"; exit 1; }
      - name: Enviar ao TestFlight
        if: ${{ inputs.apple_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: bundle exec fastlane ios testflight
