name: Hotfix e validacao do Radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-validacao.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  corrigir-validar-publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir JavaScript e textos CPTEC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('site/app.js')
          text = app.read_text(encoding='utf-8')
          bad = '$("radarSlider").addEventListener("input", e => showRadarFrame(Number(e.target.value)));\\n$("radarSpeed")?.addEventListener'
          good = '$("radarSlider").addEventListener("input", e => showRadarFrame(Number(e.target.value)));\n$("radarSpeed")?.addEventListener'
          if bad not in text:
              raise SystemExit('Hotfix esperado nao encontrado em site/app.js')
          app.write_text(text.replace(bad, good, 1), encoding='utf-8')

          index = Path('site/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('O FORTRACC é usado para validar deslocamento de sistemas convectivos nas próximas 2 horas.', 'Abra o FORTRACC para validar manualmente o deslocamento de sistemas convectivos nas próximas 2 horas; essa informação ainda não entra automaticamente no índice 0–4.')
          index.write_text(text, encoding='utf-8')

          cptec = Path('site/cptec.js')
          text = cptec.read_text(encoding='utf-8')
          text = text.replace('setStatus("nowcasting oficial", "fallback");', 'setStatus("links oficiais disponíveis", "fallback");')
          cptec.write_text(text, encoding='utf-8')

          sw = Path('site/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('radar-gm-v3-cptec', 'radar-gm-v3-cptec-hotfix')
          text = text.replace('radar-gm-v2-multicity', 'radar-gm-v3-cptec-hotfix')
          sw.write_text(text, encoding='utf-8')

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text(encoding='utf-8')
          marker = '          test -f site/sw.js\n'
          extra = '          test -f site/app.js\n          test -f site/cptec.js\n          node --check site/app.js\n          node --check site/cptec.js\n'
          if 'node --check site/app.js' not in text:
              if marker not in text:
                  raise SystemExit('Bloco de validacao nao encontrado em pages.yml')
              text = text.replace(marker, marker + extra, 1)
          pages.write_text(text, encoding='utf-8')
          PY

      - name: Validar aplicativo
        run: |
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f site/app.js
          test -f site/cptec.js
          node --check site/app.js
          node --check site/cptec.js
          grep -q 'CPTEC / INPE' site/index.html
          grep -q 'FORTRACC' site/index.html
          grep -q './cptec.js' site/sw.js

      - name: Remover workflow temporario
        run: rm .github/workflows/hotfix-validacao.yml

      - name: Registrar correcao no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js site/index.html site/cptec.js site/sw.js .github/workflows/pages.yml .github/workflows/hotfix-validacao.yml
          git commit -m "fix: valida JavaScript e esclarece camada CPTEC"
          git push origin HEAD:main

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site corrigido
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar site corrigido
        id: deployment
        uses: actions/deploy-pages@v4
