name: Publicar Radar Guarda-Mor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validar aplicativo
        run: |
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f site/app.js
          test -f site/cptec.js
          test -f site/v4.js
          test -f site/v4.css
          test -f site/v5.js
          test -f site/data/guardamor/v5.json
          test -f scripts/collect_v5.py
          test -f scripts/install_v5.py
          node --check site/app.js
          node --check site/cptec.js
          node --check site/v4.js
          node --check site/v5.js
          python -m py_compile scripts/collect_v5.py scripts/install_v5.py
          grep -q 'Análise numérica V4' site/index.html
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
